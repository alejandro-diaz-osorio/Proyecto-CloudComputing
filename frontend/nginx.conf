server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subida de archivos (PDF de hasta 10 MB en el backend)
    client_max_body_size 20m;

    # API: el navegador llama a /api/... y nginx lo reenvía al backend (servicio "backend", puerto 3000)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos de Astro con hash: caché larga
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Páginas (/login -> /login/index.html, etc.)
    location / {
        try_files $uri $uri/ =404;
    }
}